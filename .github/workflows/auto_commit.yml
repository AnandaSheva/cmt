name: Natural Auto Contribution

on:
  workflow_dispatch:

  schedule:
    # Dijalankan sekali sehari (08:00 UTC = 15:00 WIB)
    - cron: "0 8 * * *"

permissions:
  contents: write

jobs:
  contribution:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --local user.name "AnandaSheva"
          git config --local user.email "sheva1257@gmail.com"

      - name: Randomize activity
        shell: bash
        run: |

          # -----------------------------
          # Random delay (0–6 jam)
          # -----------------------------
          DELAY=$(( RANDOM % 21600 ))
          echo "Sleeping $DELAY seconds..."
          sleep $DELAY

          # -----------------------------
          # Skip beberapa hari
          # -----------------------------
          weekday=$(date +%u)

          case $weekday in
            1) chance=95 ;; # Senin
            2) chance=90 ;;
            3) chance=85 ;;
            4) chance=90 ;;
            5) chance=70 ;;
            6) chance=50 ;;
            7) chance=35 ;; # Minggu
          esac

          roll=$(( RANDOM % 100 ))

          if [ "$roll" -gt "$chance" ]; then
            echo "No activity today."
            exit 0
          fi

          mkdir -p logs

          files=(
            "logs/history.txt"
            "logs/activity.txt"
            "logs/status.txt"
            "logs/notes.txt"
            "logs/devlog.txt"
          )

          messages=(
            "docs: update"
            "fix: minor changes"
            "style: formatting"
            "build: refresh"
            "refactor: cleanup"
            "ci: update"
            "chore: maintenance"
            "chore(bot): 🌅 menyulam arunika pada riwayat"
            "chore(bot): 🌌 menitip pendar di cakrawala sunyi"
            "chore(bot): 🪶 menatah aksara pada linimasa"
            "chore(bot): 🌿 merawat rahayu dalam repositori"
            "chore(bot): 🕊️ mengirim swastamita lewat jejak kecil"
            "chore(bot): 🌊 menjaga nirmala di arus perubahan"
            "chore(bot): 🪷 menumbuhkan asmaraloka pada halaman waktu"
            "chore(bot): 🔆 menyibak bianglala selepas rinai"
            "chore(bot): 🍃 menabur ancala pada langkah senyap"
            "chore(bot): 🧭 menandai cakra manggilingan hari ini"
          )

          commits=$(( RANDOM % 5 + 1 ))

          echo "Today's commits: $commits"

          for ((i=1;i<=commits;i++))
          do

            file=${files[$RANDOM % ${#files[@]}]}

            echo "$(date -u) | $(uuidgen)" >> "$file"

            git add "$file"

            if git diff --cached --quiet; then
              continue
            fi

            msg=${messages[$RANDOM % ${#messages[@]}]}

            git commit -m "$msg"

            if [ "$i" -lt "$commits" ]; then
              sleep $(( RANDOM % 180 + 30 ))
            fi

          done

      - name: Push
        run: |
          git push
